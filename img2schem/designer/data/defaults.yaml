# Default settings for the Claude designer (layered under the user's config.yaml, SOW R11.1).
# Model IDs live here and in pricing.yaml only (CLAUDE.md). Verify them at docs.claude.com.
claude:
  model: claude-opus-5-5          # the designer (owner's choice, D-032)
  fallback_model: claude-opus-5   # re-runs a turn server-side if the designer declines it
  effort: medium                  # low | medium | high | xhigh | max (Opus 5.5 at medium ~ Opus 5 at high)
  max_tokens: 32000               # per turn (thinking + text + tool inputs)
  turn_cap: 30                    # SOW RD.1
